name: Release to NPM

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: ./

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: npm ci

      # The scan server image is built for both linux/amd64 and linux/arm64 by
      # @mridang/semantic-release-oci (via docker buildx bake). The arm64 image
      # is a real arm64 build, so an amd64 runner emulates it with QEMU, and a
      # container-driver builder is needed to emit a multi-arch manifest.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run semantic-release
        uses: mridang/action-semantic-release@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # @mridang/semantic-release-oci performs `docker login` itself using
          # these; no separate docker/login-action step is needed.
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
