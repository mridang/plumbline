name: Deploy to Cloudflare Workers

concurrency:
  group: deploy

# Deploys the web app (packages/web) on every push to master, plus manual runs.
on:
  workflow_dispatch:
  push:
    branches:
      - master

defaults:
  run:
    working-directory: ./

jobs:
  deploy-app:
    environment:
      name: production
      url: https://plumbline.apps.mrida.ng
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: npm ci

      # The web app bundles the hints package's compiled output.
      - name: Build Workspaces
        run: npm run build

      # The scan queue and its dead-letter queue must exist before the Worker
      # that binds them is deployed (wrangler.jsonc, "queues"). Create them
      # when they are missing; the API token needs Account, Queues, Edit.
      - name: Create queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: ./packages/web
        run: |
          for queue in plumbline-scans plumbline-scans-dlq; do
            npx wrangler queues info "$queue" >/dev/null 2>&1 || npx wrangler queues create "$queue"
          done

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace packages/web

      # Worker secrets that are kept as secrets of this environment are put on
      # the Worker after each deploy (the same value again is harmless), so a
      # secret is added once, in GitHub, and never by hand. Today that is the
      # key push notifications are signed with and the GitHub App's settings.
      # GitHub does not allow a secret name to start with GITHUB_, so those are
      # kept as GH_* and put on the Worker under their real names.
      - name: Put Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_SLUG: ${{ secrets.GH_APP_SLUG }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          GITHUB_PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
          GITHUB_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
        working-directory: ./packages/web
        run: |
          for name in VAPID_PRIVATE_KEY GITHUB_APP_ID GITHUB_APP_SLUG GITHUB_CLIENT_ID GITHUB_CLIENT_SECRET GITHUB_PRIVATE_KEY GITHUB_WEBHOOK_SECRET; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name"
            fi
          done
