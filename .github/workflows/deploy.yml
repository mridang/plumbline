name: Deploy to Cloudflare Workers

concurrency:
  group: deploy

# Deploys the web app (packages/web) on every push to master, plus manual runs.
on:
  workflow_dispatch:
  push:
    branches:
      - master

defaults:
  run:
    working-directory: ./

jobs:
  deploy-app:
    environment:
      name: production
    runs-on: ubuntu-latest

    steps:
      - name: Runner Common Setup
        uses: mridang/action-runner-common@v1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.nvmrc'

      - name: Install Dependencies
        run: npm ci

      # The web app bundles the hints package's compiled output.
      - name: Build Workspaces
        run: npm run build

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy --workspace packages/web

      # Worker secrets that are kept as secrets of this environment are put on
      # the Worker after each deploy (the same value again is harmless), so a
      # secret is added once, in GitHub, and never by hand. Today that is the
      # key push notifications are signed with.
      - name: Put Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        working-directory: ./packages/web
        run: |
          if [ -n "$VAPID_PRIVATE_KEY" ]; then
            printf '%s' "$VAPID_PRIVATE_KEY" | npx wrangler secret put VAPID_PRIVATE_KEY
          fi
